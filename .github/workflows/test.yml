name: API tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: cp .env.example .env
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest --collect-only -q

  regression:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Configure tests
        run: cp .env.example .env
      - name: Collect tests
        run: python -m pytest --collect-only -q
      - name: Check out test server
        uses: actions/checkout@v6
        with:
          repository: Nikita-Filonov/qa-automation-engineer-api-course
          ref: ebadfac2cd8de74313e7f5469204e6e8171dd20e
          path: .server
      - name: Install server separately
        run: |
          python -m venv .server/.venv
          .server/.venv/bin/python -m pip install -r .server/requirements.txt
      - name: Start server
        working-directory: .server
        env:
          APP_HOST: http://127.0.0.1:8000
          DATABASE_URL: sqlite+aiosqlite:///./local.db
          JWT_ALGORITHM: HS256
          JWT_SECRET_KEY: ephemeral-ci-test-key
          JWT_ACCESS_TOKEN_EXPIRE: '1800'
          JWT_REFRESH_TOKEN_EXPIRE: '5184000'
        run: .venv/bin/python -m uvicorn main:app --host 127.0.0.1 --port 8000 > ../server.log 2>&1 &
      - name: Wait for API readiness
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:8000/openapi.json > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "API did not become ready within the timeout."
          exit 1
      - name: Run regression tests
        run: python -m pytest -m regression -n 2 --tb=short
      # Allure attachments can contain credentials. Keep reports local until redacted.
